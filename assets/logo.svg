<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#013a7a"/>
      <stop offset="100%" stop-color="#011d4a"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="25%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <clipPath id="rounded">
      <rect width="256" height="256" rx="32"/>
    </clipPath>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00bcf2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00bcf2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00bcf2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>

  <!-- Glow overlay -->
  <rect width="256" height="256" rx="32" fill="url(#glow)"/>

  <!-- PS badge background -->
  <rect x="68" y="46" width="120" height="80" rx="12" fill="url(#badge)" opacity="0.15"/>
  <rect x="68" y="46" width="120" height="80" rx="12" fill="none" stroke="#00bcf2" stroke-width="1.5" opacity="0.4"/>

  <!-- PS monogram -->
  <text x="128" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="66"
        font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">PS</text>

  <!-- Divider line -->
  <rect x="28" y="162" width="200" height="1.5" fill="url(#divider)"/>

  <!-- SCRIPTBUILDER text -->
  <text x="128" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20"
        font-weight="500" fill="#cce8f8" text-anchor="middle" textLength="190" lengthAdjust="spacing">ScriptBuilder</text>

  <!-- Outer border -->
  <rect x="2.5" y="2.5" width="251" height="251" rx="32" fill="none" stroke="#00bcf2" stroke-width="5" opacity="0.85"/>
</svg>
